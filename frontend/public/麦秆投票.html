<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麦秆投票 (StrawPoll) - AI Co-Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="auth.js"></script>
    <script src="storage.js"></script>
    <script src="workflow-nav.js"></script>
    <script src="thinklet-common.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .poll-card { transition: all 0.3s ease; }
        .poll-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .point-btn { transition: all 0.15s ease; width: 32px; height: 32px; }
        .point-btn:hover { transform: scale(1.15); }
        .point-btn:active { transform: scale(0.95); }

        .rank-bar { transition: width 0.5s ease, background 0.3s ease; }
        .rank-1 { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .rank-2 { background: linear-gradient(90deg, #94a3b8, #cbd5e1); }
        .rank-3 { background: linear-gradient(90deg, #d97706, #f59e0b); }

        .crown { animation: crownBounce 0.6s ease; }
        @keyframes crownBounce { 0% { transform: scale(0) rotate(-20deg); } 60% { transform: scale(1.3) rotate(5deg); } 100% { transform: scale(1) rotate(0); } }
        .budget-pulse { animation: budgetPulse 0.4s ease; }
        @keyframes budgetPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

    <!-- 左侧流程 + 右侧成员由 thinklet-common.js 注入 -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- 顶部 -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 z-20 shadow-sm">
        <div class="flex items-center gap-4">
            <a href="水桶漫步.html" class="text-slate-400 hover:text-slate-600 transition" title="上一步：水桶漫步"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="flex flex-col">
                <h1 class="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-ranking-star text-rose-500"></i>
                    麦秆投票 (StrawPoll)
                </h1>
                <span class="text-xs text-slate-500">分配点数给观点 · 预算制评分 · AI 分析投票结果</span>
            </div>
            <div class="h-8 w-px bg-slate-200"></div>
            <div class="flex items-center gap-2 bg-rose-50 text-rose-700 px-3 py-1 rounded-full text-xs font-bold border border-rose-100">
                <i class="fa-solid fa-hourglass-half"></i>
                <span id="timer">05:59</span>
            </div>
        </div>

        <!-- 预算条 -->
        <div class="hidden md:flex items-center gap-3">
            <span class="text-xs text-slate-400 font-bold">剩余点数</span>
            <div class="flex items-center gap-1">
                <div class="w-48 bg-slate-200 rounded-full h-3 overflow-hidden">
                    <div id="budget-bar" class="h-3 rounded-full bg-gradient-to-r from-rose-500 to-pink-400 transition-all" style="width: 100%"></div>
                </div>
                <span id="budget-num" class="text-lg font-bold text-rose-600 ml-2 budget-pulse">10</span>
                <span class="text-xs text-slate-400">/ 10</span>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="triggerAIAnalysis()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-md flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> AI 分析
            </button>
            <button onclick="submitVotes()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-md flex items-center gap-2">
                提交投票 <i class="fa-solid fa-paper-plane"></i>
            </button>
            <a href="首页.html" class="text-slate-400 hover:text-slate-600 transition ml-2" title="返回首页"><i class="fa-solid fa-home"></i></a>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- 投票主区域 -->
        <div class="flex-1 overflow-y-auto p-6 custom-scroll">
            <div id="poll-list" class="max-w-3xl mx-auto space-y-3"></div>
        </div>

        <!-- 右侧面板 -->
        <aside class="w-80 bg-white border-l border-slate-200 flex flex-col hidden lg:flex">
            <div class="p-4 border-b border-slate-100">
                <h3 class="font-bold text-slate-700 flex items-center gap-2"><i class="fa-solid fa-trophy text-blue-500"></i> 实时排名</h3>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-3 custom-scroll">
                <div id="ranking-list" class="space-y-3"></div>

                <!-- AI 分析结果 -->
                <div id="ai-analysis-box" class="hidden mt-4 pt-4 border-t border-slate-100">
                    <h4 class="text-xs font-bold text-rose-600 uppercase mb-2"><i class="fa-solid fa-brain"></i> AI 投票洞察</h4>
                    <div id="ai-analysis-content" class="text-xs text-slate-600 leading-relaxed"></div>
                </div>
            </div>

            <!-- 成员状态 -->
            <div class="p-4 border-t border-slate-100 bg-slate-50">
                <h4 class="text-xs font-bold text-slate-400 mb-2">参与者</h4>
                <div id="member-list-panel" class="space-y-2">
                    <div class="text-xs text-slate-400">加载中...</div>
                </div>
            </div>
        </aside>
    </main>

    <script>
        const TOTAL_BUDGET = 10;
        let budget = TOTAL_BUDGET;

        // 从共享数据加载（ThinkLetCommon 标准加载）
        const _roomId = ThinkLetCommon.getRoomId();
        const seedData = ThinkLetCommon.loadSeedData();
        const ideas = seedData.length > 0 ? seedData.map((item, i) => ({
            id: item.id || (i + 1),
            text: item.text,
            source: item.author || 'AI',
            category: item.bucket || '待分类',
            myPoints: 0,
            otherPoints: 0,
        })) : [
            { id: 1, text: '暂无数据 — 请在首页采纳意见后跳转到此页面', source: '系统', category: '系统', myPoints: 0, otherPoints: 0 },
        ];

        function renderCards() {
            const list = document.getElementById('poll-list');
            list.innerHTML = '';
            ideas.forEach(idea => {
                const totalPts = idea.myPoints + idea.otherPoints;
                const card = document.createElement('div');
                card.className = `poll-card bg-white p-5 rounded-xl border-2 ${idea.myPoints > 0 ? 'border-rose-200' : 'border-slate-200'} shadow-sm`;
                card.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="flex flex-col items-center gap-1 flex-shrink-0">
                            <button class="point-btn rounded-lg border border-slate-200 flex items-center justify-center text-green-500 hover:bg-green-50 ${budget <= 0 ? 'opacity-30 cursor-not-allowed' : ''}"
                                    onclick="addPoint(${idea.id})" ${budget <= 0 ? 'disabled' : ''}>
                                <i class="fa-solid fa-plus text-sm"></i>
                            </button>
                            <div class="text-2xl font-bold ${idea.myPoints > 0 ? 'text-rose-600' : 'text-slate-300'}">${idea.myPoints}</div>
                            <button class="point-btn rounded-lg border border-slate-200 flex items-center justify-center text-red-400 hover:bg-red-50 ${idea.myPoints <= 0 ? 'opacity-30 cursor-not-allowed' : ''}"
                                    onclick="removePoint(${idea.id})" ${idea.myPoints <= 0 ? 'disabled' : ''}>
                                <i class="fa-solid fa-minus text-sm"></i>
                            </button>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-xs font-bold text-slate-400">${idea.source}</span>
                                <span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">${idea.category}</span>
                            </div>
                            <p class="text-sm text-slate-700 font-medium mb-2">${idea.text}</p>
                            <div class="flex items-center gap-2 text-xs text-slate-400">
                                <div class="flex-1 bg-slate-100 rounded-full h-2 overflow-hidden">
                                    <div class="rank-bar h-2 rounded-full ${totalPts > 6 ? 'rank-1' : totalPts > 3 ? 'rank-2' : 'bg-slate-300'}" style="width: ${Math.min(totalPts / 12 * 100, 100)}%"></div>
                                </div>
                                <span class="font-bold text-slate-600">${totalPts} pts</span>
                                <span class="text-[10px]">(你: ${idea.myPoints} · 他人: ${idea.otherPoints})</span>
                            </div>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function addPoint(id) {
            if (budget <= 0) return;
            const idea = ideas.find(i => i.id === id);
            idea.myPoints++;
            budget--;
            updateBudget();
            renderCards();
            renderRanking();
        }

        function removePoint(id) {
            const idea = ideas.find(i => i.id === id);
            if (idea.myPoints <= 0) return;
            idea.myPoints--;
            budget++;
            updateBudget();
            renderCards();
            renderRanking();
        }

        function updateBudget() {
            const pct = budget / TOTAL_BUDGET * 100;
            document.getElementById('budget-bar').style.width = pct + '%';
            const numEl = document.getElementById('budget-num');
            numEl.textContent = budget;
            numEl.classList.remove('budget-pulse');
            void numEl.offsetWidth;
            numEl.classList.add('budget-pulse');
            if (budget <= 2) numEl.classList.add('text-red-600');
            else numEl.classList.remove('text-red-600');
        }

        function renderRanking() {
            const sorted = [...ideas].sort((a, b) => (b.myPoints + b.otherPoints) - (a.myPoints + a.otherPoints));
            const maxPts = sorted.length > 0 ? sorted[0].myPoints + sorted[0].otherPoints : 1;
            const list = document.getElementById('ranking-list');
            list.innerHTML = '';

            sorted.forEach((idea, idx) => {
                const totalPts = idea.myPoints + idea.otherPoints;
                const pct = Math.max(totalPts / Math.max(maxPts, 1) * 100, 8);
                const medalIcons = ['fa-crown text-blue-500', 'fa-medal text-slate-400', 'fa-medal text-blue-700'];
                const el = document.createElement('div');
                el.className = 'fade-in';
                el.innerHTML = `
                    <div class="flex items-center gap-2 mb-1">
                        <span class="w-5 text-center">
                            ${idx < 3 ? `<i class="fa-solid ${medalIcons[idx]} text-sm ${idx === 0 ? 'crown' : ''}"></i>` : `<span class="text-xs text-slate-400 font-bold">${idx + 1}</span>`}
                        </span>
                        <span class="text-xs text-slate-700 font-medium truncate flex-1">${idea.text.substring(0, 25)}...</span>
                        <span class="text-xs font-bold ${idx === 0 ? 'text-blue-600' : 'text-slate-500'}">${totalPts}</span>
                    </div>
                    <div class="ml-7 bg-slate-100 rounded-full h-1.5 overflow-hidden">
                        <div class="rank-bar h-1.5 rounded-full ${idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : 'bg-slate-300'}" style="width: ${pct}%"></div>
                    </div>
                `;
                list.appendChild(el);
            });
        }

        async function triggerAIAnalysis() {
            const btn = document.querySelector('[onclick="triggerAIAnalysis()"]');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 分析中...';
            btn.disabled = true;

            const ideaSummary = ideas.map(i => `"${i.text}" (总分: ${i.myPoints + i.otherPoints}, 类别: ${i.category})`).join('\n');
            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `以下是当前投票结果：\n${ideaSummary}\n\n请分析投票趋势：1) 哪些观点最受欢迎？为什么？2) 类别偏好如何分布？3) 给出最终排名建议（3句话以内）。`,
                        model_id: 'deepseek-v3',
                        history: [],
                        system_prompt: '你是投票分析助手。简洁分析投票结果，给出有洞察力的总结，总共不超过100字。'
                    })
                });
                if (resp.ok) {
                    const data = await resp.json();
                    document.getElementById('ai-analysis-box').classList.remove('hidden');
                    document.getElementById('ai-analysis-content').textContent = data.content;
                } else {
                    alert('AI 调用失败');
                }
            } catch (e) {
                alert('网络错误: ' + e.message);
            }
            btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> AI 分析';
            btn.disabled = false;
        }

        function submitVotes() {
            const spent = TOTAL_BUDGET - budget;
            if (spent === 0) { alert('你还没有分配任何点数'); return; }
            const top = [...ideas].sort((a, b) => (b.myPoints + b.otherPoints) - (a.myPoints + a.otherPoints));
            // 保存投票结果到步骤结果（按得分排序）
            const resultIdeas = top.filter(i => (i.myPoints + i.otherPoints) > 0).map(i => ({
                id: i.id, text: i.text, author: i.source, votes: i.myPoints + i.otherPoints,
            }));
            ThinkLetCommon.saveStepResult(resultIdeas);
            alert(`投票已提交！\n分配: ${spent}/${TOTAL_BUDGET} 点\n\n当前排名:\n${top.map((i, idx) => `${idx + 1}. ${i.text.substring(0, 25)}... (${i.myPoints + i.otherPoints} pts)`).join('\n')}`);
        }

        renderCards();
        renderRanking();

        // ═══ 共用模块初始化 ═══
        ThinkLetCommon.init();
        if (typeof WorkflowNav !== 'undefined' && WorkflowNav.updateNextButton) WorkflowNav.updateNextButton();
    </script>
    </div>
</body>
</html>
