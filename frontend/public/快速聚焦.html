<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快速聚焦 (FastFocus) - AI Co-Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="auth.js"></script>
    <script src="storage.js?v=20260515-1"></script>
    <script src="workflow-nav.js?v=20260515-1"></script>
    <script src="room-members.js?v=20260515-1"></script>
    <script src="thinklet-common.js?v=20260515-1"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .vote-card { transition: all 0.3s ease; }
        .vote-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .vote-card.voted-keep { border-color: #22c55e; background: #f0fdf4; }
        .vote-card.voted-merge { border-color: #f59e0b; background: #fffbeb; }
        .vote-card.voted-discard { border-color: #ef4444; background: #fef2f2; }

        .vote-btn { transition: all 0.15s ease; }
        .vote-btn:hover { transform: scale(1.1); }
        .vote-btn.active-keep { background: #22c55e; color: white; }
        .vote-btn.active-merge { background: #f59e0b; color: white; }
        .vote-btn.active-discard { background: #ef4444; color: white; }

        .progress-ring { transition: stroke-dashoffset 0.5s ease; }
        .merge-suggest { animation: pulseGlow 2s ease-in-out infinite; }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.15); } 50% { box-shadow: 0 0 0 8px rgba(245,158,11,0); } }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

    <!-- 左侧流程 + 右侧成员由 thinklet-common.js 注入 -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- 顶部 -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 z-20 shadow-sm">
        <div class="flex items-center gap-4">
            <a href="思维跳跃.html" class="text-slate-400 hover:text-slate-600 transition" title="上一步：思维跳跃"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="flex flex-col">
                <h1 class="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-bullseye text-blue-500"></i>
                    快速聚焦 (FastFocus)
                </h1>
                <span class="text-xs text-slate-500">保留 · 合并 · 淘汰 — 快速收敛到核心观点</span>
            </div>
            <div class="h-8 w-px bg-slate-200"></div>
            <div class="flex items-center gap-2 bg-blue-50 text-blue-700 px-3 py-1 rounded-full text-xs font-bold border border-blue-100">
                <i class="fa-solid fa-hourglass-half"></i>
                <span id="timer">04:59</span>
            </div>
        </div>

        <div class="hidden md:flex items-center gap-4">
            <div class="text-center">
                <div class="text-lg font-bold text-green-600" id="stat-keep">0</div>
                <div class="text-[10px] text-slate-400">保留</div>
            </div>
            <div class="text-center">
                <div class="text-lg font-bold text-blue-600" id="stat-merge">0</div>
                <div class="text-[10px] text-slate-400">合并</div>
            </div>
            <div class="text-center">
                <div class="text-lg font-bold text-red-500" id="stat-discard">0</div>
                <div class="text-[10px] text-slate-400">淘汰</div>
            </div>
            <div class="text-center">
                <div class="text-lg font-bold text-slate-400" id="stat-pending">0</div>
                <div class="text-[10px] text-slate-400">待定</div>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="triggerAIMergeDetect()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-md flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> AI 查重合并
            </button>
            <button onclick="applyResults()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-md flex items-center gap-2">
                应用结果 <i class="fa-solid fa-check"></i>
            </button>
            <a href="首页.html" class="text-slate-400 hover:text-slate-600 transition ml-2" title="返回首页"><i class="fa-solid fa-home"></i></a>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- 观点投票列表 -->
        <div class="flex-1 overflow-y-auto p-6 custom-scroll">
            <div id="vote-list" class="max-w-3xl mx-auto space-y-3">
            </div>
        </div>

        <!-- 右侧面板 -->
        <aside class="w-80 bg-white border-l border-slate-200 flex flex-col hidden lg:flex">
            <div class="p-4 border-b border-slate-100">
                <h3 class="font-bold text-slate-700 flex items-center gap-2"><i class="fa-solid fa-chart-pie text-blue-500"></i> 投票概览</h3>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-4 custom-scroll">
                <div class="bg-slate-50 rounded-xl p-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium text-slate-700">投票进度</span>
                        <span class="text-sm font-bold text-blue-600" id="progress-pct">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-blue-500 h-2.5 rounded-full transition-all" style="width: 0%"></div>
                    </div>
                </div>

                <div id="ai-merge-box" class="hidden">
                    <h4 class="text-xs font-bold text-blue-600 uppercase mb-2"><i class="fa-solid fa-link"></i> AI 合并建议</h4>
                    <div id="ai-merge-list" class="space-y-2"></div>
                </div>

                <div>
                    <h4 class="text-xs font-bold text-slate-400 uppercase mb-2">实时活动</h4>
                    <div id="activity-feed" class="space-y-2">
                        <div class="flex items-center gap-2 text-xs text-slate-500">
                            <div class="w-5 h-5 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-[10px] font-bold"><i class="fa-solid fa-user text-[8px]"></i></div>
                            <span>等待用户加入...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-slate-100">
                <h4 class="text-xs font-bold text-slate-400 mb-2">成员投票状态</h4>
                <div id="member-status" class="space-y-2">
                    <div class="text-xs text-slate-400">加载中...</div>
                </div>
            </div>
        </aside>
    </main>

    <script>
        ThinkLetCommon.init();
        const seedData = ThinkLetCommon.loadSeedData();
        const ideas = seedData.length > 0 ? seedData.map((item, i) => ({
            id: String(item.id ?? (i + 1)),
            text: item.text,
            source: item.author || 'AI',
            icon: 'fa-lightbulb',
            iconBg: 'bg-blue-100',
            iconColor: 'text-blue-600',
        })) : [
            { id: '1', text: '暂无数据 — 请在上一环节完成后进入本页，或先在首页采纳意见', source: '系统', icon: 'fa-info-circle', iconBg: 'bg-slate-100', iconColor: 'text-slate-400' },
        ];

        const votes = {}; // key: String(ideaId)

        function _voteKey(id) { return String(id); }

        function renderCards() {
            const list = document.getElementById('vote-list');
            list.innerHTML = '';
            ideas.forEach(idea => {
                const vote = votes[_voteKey(idea.id)] || null;
                const card = document.createElement('div');
                card.className = `vote-card bg-white p-5 rounded-xl border-2 border-slate-200 shadow-sm flex items-start gap-4 ${vote ? 'voted-' + vote : ''}`;
                card.id = 'card-' + idea.id;

                const iconEl = idea.icon
                    ? `<div class="w-8 h-8 rounded-full ${idea.iconBg} ${idea.iconColor} flex items-center justify-center text-sm"><i class="fa-solid ${idea.icon}"></i></div>`
                    : `<div class="w-8 h-8 rounded-full ${idea.iconBg} ${idea.iconColor} flex items-center justify-center text-sm font-bold">${idea.initial}</div>`;

                const idJs = JSON.stringify(idea.id);

                card.innerHTML = `
                    <div class="flex-shrink-0">${iconEl}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs font-bold text-slate-400">${idea.source}</span>
                            ${vote ? `<span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${vote === 'keep' ? 'bg-green-100 text-green-700' : vote === 'merge' ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-700'}">${vote === 'keep' ? '保留' : vote === 'merge' ? '合并' : '淘汰'}</span>` : ''}
                        </div>
                        <p class="text-sm text-slate-700 font-medium">${idea.text}</p>
                    </div>
                    <div class="flex gap-2 flex-shrink-0">
                        <button class="vote-btn w-9 h-9 rounded-lg border flex items-center justify-center text-lg ${vote === 'keep' ? 'active-keep border-green-500' : 'border-slate-200 text-green-500 hover:bg-green-50'}" onclick="castVote(${idJs}, 'keep')" title="保留">
                            <i class="fa-solid fa-check"></i>
                        </button>
                        <button class="vote-btn w-9 h-9 rounded-lg border flex items-center justify-center text-lg ${vote === 'merge' ? 'active-merge border-blue-500' : 'border-slate-200 text-blue-500 hover:bg-blue-50'}" onclick="castVote(${idJs}, 'merge')" title="合并">
                            <i class="fa-solid fa-code-merge"></i>
                        </button>
                        <button class="vote-btn w-9 h-9 rounded-lg border flex items-center justify-center text-lg ${vote === 'discard' ? 'active-discard border-red-500' : 'border-slate-200 text-red-500 hover:bg-red-50'}" onclick="castVote(${idJs}, 'discard')" title="淘汰">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function castVote(id, type) {
            const key = _voteKey(id);
            if (votes[key] === type) { votes[key] = null; } else { votes[key] = type; }
            renderCards();
            updateStats();
            const userName = (Auth.getUser() || {}).display_name || '用户';
            addActivity(`${userName} ${votes[key] ? (votes[key] === 'keep' ? '保留' : votes[key] === 'merge' ? '标记合并' : '淘汰') : '取消投票'} 了观点 #${key}`);
        }

        function updateStats() {
            let keep = 0, merge = 0, discard = 0, pending = 0;
            ideas.forEach(i => {
                const v = votes[_voteKey(i.id)];
                if (v === 'keep') keep++;
                else if (v === 'merge') merge++;
                else if (v === 'discard') discard++;
                else pending++;
            });
            document.getElementById('stat-keep').textContent = keep;
            document.getElementById('stat-merge').textContent = merge;
            document.getElementById('stat-discard').textContent = discard;
            document.getElementById('stat-pending').textContent = pending;

            const total = ideas.length;
            const voted = total - pending;
            const pct = total > 0 ? Math.round(voted / total * 100) : 0;
            document.getElementById('progress-pct').textContent = pct + '%';
            document.getElementById('progress-bar').style.width = pct + '%';
        }

        function addActivity(text) {
            const feed = document.getElementById('activity-feed');
            const el = document.createElement('div');
            el.className = 'flex items-center gap-2 text-xs text-slate-500 fade-in';
            el.innerHTML = `<div class="w-5 h-5 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-[10px] font-bold">刘</div><span>${text}</span>`;
            feed.prepend(el);
        }

        async function triggerAIMergeDetect() {
            const btn = document.querySelector('[onclick="triggerAIMergeDetect()"]');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 分析中...';
            btn.disabled = true;

            const ideaTexts = ideas.map(i => `#${i.id}: ${i.text}`).join('\n');
            const msg = '以下是头脑风暴得到的观点列表：\n' + ideaTexts + '\n\n请识别其中语义相似或可以合并的观点对。每行输出格式：#A + #B = 合并后的新表述（不超过30字）。只输出可合并的对，不要解释。';
            const sys = '你是一个观点去重与合并助手。识别语义相似的观点对并给出合并建议。严格按指定格式输出。';

            try {
                const fetchFn = (typeof Auth !== 'undefined' && Auth.isLoggedIn()) ? Auth.apiCall : fetch;
                const resp = await fetchFn('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: msg,
                        model_id: 'deepseek-v3',
                        history: [],
                        system_prompt: sys,
                    }),
                });
                if (resp.ok) {
                    const data = await resp.json();
                    const lines = data.content.split('\n').filter(l => l.includes('#') && l.includes('+'));
                    const box = document.getElementById('ai-merge-box');
                    const list = document.getElementById('ai-merge-list');
                    box.classList.remove('hidden');
                    list.innerHTML = '';
                    if (lines.length === 0) {
                        list.innerHTML = '<div class="text-xs text-slate-400">未发现可合并的观点对</div>';
                    } else {
                        lines.forEach(line => {
                            const row = document.createElement('div');
                            row.className = 'merge-suggest bg-blue-50 border border-slate-200 rounded-lg p-3 text-xs text-blue-800 fade-in';
                            row.innerHTML = `<i class="fa-solid fa-link mr-1"></i> ${line}`;
                            list.appendChild(row);
                        });
                    }
                } else {
                    alert('AI 调用失败');
                }
            } catch (e) {
                alert('网络错误: ' + e.message);
            }
            btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> AI 查重合并';
            btn.disabled = false;
        }

        function applyResults() {
            if (ThinkLetCommon.getRoomId() && typeof WorkflowNav !== 'undefined' && WorkflowNav.isHost && !WorkflowNav.isHost()) {
                alert('仅房主可应用结果并推进流程');
                return;
            }
            const kept = ideas.filter(i => votes[_voteKey(i.id)] === 'keep');
            const pending = ideas.filter(i => !votes[_voteKey(i.id)]);
            if (pending.length > 0) {
                if (!confirm(`还有 ${pending.length} 条观点未投票，确认应用当前结果？`)) return;
            }
            const resultIdeas = kept.map(i => ({ id: i.id, text: i.text, author: i.source, votes: 0 }));
            ThinkLetCommon.saveStepResult(resultIdeas);
            if (typeof WorkflowNav !== 'undefined' && WorkflowNav.completeCurrentStepAndGoNext) {
                WorkflowNav.completeCurrentStepAndGoNext();
            }
        }

        renderCards();
        updateStats();

        ThinkLetCommon.setupRoomSync({
            onTimelineChange: () => { if (ThinkLetCommon.getRoomId()) location.reload(); },
        });
        if (typeof WorkflowNav !== 'undefined' && WorkflowNav.updateNextButton) WorkflowNav.updateNextButton();
    </script>
    </div>
</body>
</html>
